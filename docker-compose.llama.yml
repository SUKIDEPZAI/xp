# Optional app + self-hosted inference stack. Put a licensed GGUF model in ./models/model.gguf.
# Run: docker compose -f docker-compose.llama.yml up --build
services:
  xp-desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: xp-living-desktop:0.4.5
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AI_BACKEND: llama.cpp
      LLAMA_CPP_BASE_URL: http://llama:8080/v1
      LLAMA_CPP_MODEL: ${LLAMA_CPP_MODEL:-local-model}
      LLAMA_CPP_ALLOW_INSECURE_HTTP: "true"
      LLAMA_CPP_TIMEOUT_MS: ${LLAMA_CPP_TIMEOUT_MS:-60000}
      LLAMA_CPP_MAX_TOKENS: ${LLAMA_CPP_MAX_TOKENS:-1200}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.65}
      AI_DATABASE_URLS: ${AI_DATABASE_URLS:-}
    depends_on:
      llama:
        condition: service_healthy
    restart: unless-stopped

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/${LLAMA_CPP_MODEL_FILE:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CPP_CTX_SIZE:-4096}"
      - "-t"
      - "${LLAMA_CPP_THREADS:-4}"
      - "-np"
      - "${LLAMA_CPP_PARALLEL:-1}"
      - "--alias"
      - "${LLAMA_CPP_MODEL:-local-model}"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    restart: unless-stopped
