[package]
name = "xp-living-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic decision and motion core for Windows XP Living Desktop"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
